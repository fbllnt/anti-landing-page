<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ANTI · Acesso restrito</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{--preto:#000;--lima:#E9FC00;--vermelho:#F61F3E;--branco:#fff;--line:rgba(255,255,255,.15)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--preto);color:var(--branco);font-family:"Inter",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:min(420px,100%);display:flex;flex-direction:column;gap:22px}
.icon{width:46px;height:46px;border-radius:9px;background:var(--lima);display:grid;place-items:center}
.icon img{width:32px}
.eyebrow{font-family:"Roboto Mono",monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--lima);display:flex;gap:10px;align-items:center}
.eyebrow i{width:8px;height:8px;background:var(--vermelho);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h1{font-family:"Anybody",Impact,sans-serif;font-weight:850;font-stretch:135%;font-variation-settings:"wdth" 135;text-transform:uppercase;font-size:clamp(30px,8vw,44px);line-height:.92}
h1 em{font-style:normal;color:var(--lima)}
form{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:20px}
label{font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;opacity:.7}
input{font:inherit;font-size:16px;background:transparent;color:var(--branco);border:1px solid var(--branco);border-radius:10px;padding:14px 16px;outline:none}
input:focus{border-color:var(--lima)}
button{font-family:"Anybody",Impact,sans-serif;font-weight:850;font-stretch:135%;font-variation-settings:"wdth" 135;text-transform:uppercase;font-size:15px;background:var(--lima);color:var(--preto);border:0;border-radius:10px;padding:16px 22px;cursor:pointer;display:flex;justify-content:space-between}
button:hover{background:var(--vermelho);color:var(--branco)}
button:disabled{opacity:.6;cursor:wait}
.err{font-family:"Roboto Mono",monospace;font-size:13px;color:var(--vermelho);min-height:18px}
.foot{font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;opacity:.5;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<main class="box">
  <span class="icon"><img src="img/logo/anti-icone-preto.svg" alt="ANTI"></span>
  <p class="eyebrow"><i></i>Acesso restrito · rascunho de design</p>
  <h1>Esse pagamento <em>tem senha.</em></h1>
  <form id="f" autocomplete="off">
    <label for="pw">Senha</label>
    <input id="pw" type="password" required autofocus>
    <button id="go" type="submit"><span>Entrar</span><span>→</span></button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="foot"><span>FLT ANTI-003</span><span>ETD 18:15</span></p>
</main>
